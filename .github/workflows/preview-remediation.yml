name: Preview remediation validation

on:
  push:
    branches:
      - fix/preview-remediation-2026-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-remediation-2026-11
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile for pinned Vite 8.1.5
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact lockfile
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: sync lockfile with Vite 8.1.5"
            git push origin HEAD:fix/preview-remediation-2026-11
          fi
