name: Safe dependency refresh

on:
  push:
    branches:
      - chore/production-readiness-2026-11
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: chore/production-readiness-2026-11
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install exact lockfile
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Report remaining audit findings
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("/tmp/audit.json", "utf8"));
            console.log("REMAINING_AUDIT_COUNTS", JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log("REMAINING_AUDIT_ITEM", JSON.stringify({
                name, severity: item.severity, direct: item.isDirect,
                fixAvailable: item.fixAvailable, nodes: item.nodes
              }));
            }
          '

      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: apply compatible npm audit fixes"
            git push origin HEAD:chore/production-readiness-2026-11
          else
            echo "No compatible lockfile updates were available."
          fi
