name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit dependency details
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            console.log("AUDIT_COUNTS", JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log("AUDIT_ITEM", JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : {
                  name: v.name, title: v.title, url: v.url, range: v.range, severity: v.severity
                }),
                effects: item.effects,
                nodes: item.nodes
              }));
            }
          '
      - name: Report dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            console.log("AUDIT_COUNTS", JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          '
      - name: Lint security changes
        run: npx eslint src/lib/page.server.ts src/lib/page.server.test.ts src/lib/tools/cite-format.ts src/lib/tools/cite-format.test.ts

      - name: Unit tests
        env:
          # Optional dedicated QA-only database secrets; never use production credentials here.
          LIBRARY_QA_PRIVILEGED_DATABASE_URL: ${{ secrets.LIBRARY_QA_PRIVILEGED_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VERIFAI_QA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VERIFAI_QA_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test

      - name: Production build
        run: npm run build

      - name: Development server preview smoke test
        run: |
          set -e
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/verfiai-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/verfiai-home.html; then
              break
            fi
            sleep 2
          done
          test -s /tmp/verfiai-home.html
          grep -qi '<html' /tmp/verfiai-home.html
          if grep -q 'Missing Supabase environment variable' /tmp/verfiai-home.html; then
            cat /tmp/verfiai-vite.log
            exit 1
          fi
