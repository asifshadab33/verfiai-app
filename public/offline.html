<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f3f99" />
    <title>You're offline | Verfiai</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: #252545;
        background: #fbfbfd;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 34rem);
        padding: 2rem;
        border: 1px solid #e4e4ee;
        border-radius: 1rem;
        background: #fff;
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
      }
      p {
        color: #626278;
        line-height: 1.7;
      }
      button {
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.25rem;
        color: #fff;
        background: #3f3f99;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #7777d0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to continue checking claims and citations with Verfiai.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
